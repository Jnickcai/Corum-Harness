<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Corum Harness 启动</title>
<style>
  :root {
    --purple: #5B21F5;
    --purple-light: #B98CFF;
    --cyan: #01CDFE;
    --pink: #FF71CE;
    --bg-deep: #0A0612;
    --text: #FFFFFF;
    --text-dim: #7B6896;
    --text-mid: #B98CFF;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: linear-gradient(135deg, #0A0612 0%, #120820 40%, #0E0A18 70%, #0A0612 100%);
    color: var(--text);
    font-family: 'Inter', -apple-system, 'PingFang SC', 'SF Pro Text', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  /* 背景光晕 */
  .glow {
    position: fixed;
    border-radius: 50%;
    filter: blur(60px);
    pointer-events: none;
    z-index: 0;
  }
  .glow-1 { background: var(--purple); opacity: 0.10; width: 450px; height: 350px; top: 8%; left: 12%; animation: drift1 12s ease-in-out infinite alternate; }
  .glow-2 { background: var(--cyan); opacity: 0.06; width: 380px; height: 280px; top: 15%; right: 10%; animation: drift2 15s ease-in-out infinite alternate; }
  .glow-3 { background: var(--pink); opacity: 0.04; width: 400px; height: 250px; bottom: 10%; left: 30%; animation: drift3 18s ease-in-out infinite alternate; }
  @keyframes drift1 { from { transform: translate(0, 0); } to { transform: translate(40px, 30px); } }
  @keyframes drift2 { from { transform: translate(0, 0); } to { transform: translate(-30px, 40px); } }
  @keyframes drift3 { from { transform: translate(0, 0); } to { transform: translate(20px, -30px); } }

  #canvas {
    position: fixed;
    inset: 0;
    z-index: 1;
  }

  .overlay {
    position: fixed;
    inset: 0;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0;
    pointer-events: none;
  }
  .code-hint {
    font-family: 'JetBrains Mono', 'SF Mono', monospace;
    font-size: 11px;
    color: var(--text-dim);
    margin-bottom: 18px;
    opacity: 0;
    transition: opacity 0.6s ease;
  }
  .code-hint.show { opacity: 1; }
  .brand {
    font-size: 52px;
    font-weight: 700;
    color: var(--text);
    letter-spacing: 2px;
    opacity: 0;
    transition: opacity 0.8s ease;
    text-shadow: 0 0 30px rgba(91, 33, 245, 0.3);
  }
  .brand.show { opacity: 1; }
  .slogan {
    font-size: 16px;
    color: var(--cyan);
    letter-spacing: 3px;
    margin-top: 12px;
    opacity: 0;
    transition: opacity 0.8s ease 0.3s;
  }
  .slogan.show { opacity: 1; }
  .prog-section {
    margin-top: 40px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    opacity: 0;
    transition: opacity 0.6s ease;
  }
  .prog-section.show { opacity: 1; }
  .prog-track {
    width: 300px;
    height: 3px;
    background: rgba(55, 32, 80, 0.6);
    border-radius: 2px;
    overflow: hidden;
  }
  .prog-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--purple), var(--purple-light));
    border-radius: 2px;
    transition: width 0.3s ease;
  }
  .phase-text {
    font-size: 12px;
    color: var(--text-mid);
    letter-spacing: 1px;
  }
  @media (prefers-reduced-motion: reduce) {
    .glow { animation: none !important; }
    * { transition: none !important; }
  }
</style>
</head>
<body>
  <div class="glow glow-1"></div>
  <div class="glow glow-2"></div>
  <div class="glow glow-3"></div>
  <canvas id="canvas"></canvas>
  <div class="overlay">
    <div class="code-hint" id="codeHint">// 代码片段汇聚中…</div>
    <div class="brand" id="brand">Corum Harness</div>
    <div class="slogan" id="slogan">立矩成道  Agent 成团开发</div>
    <div class="prog-section" id="progSection">
      <div class="prog-track"><div class="prog-fill" id="progFill"></div></div>
      <div class="phase-text" id="phaseText">检查环境</div>
    </div>
  </div>

<script>
(() => {
  "use strict";
  const canvas = document.getElementById("canvas");
  const ctx = canvas.getContext("2d");
  const $ = s => document.getElementById(s);
  let W = 0, H = 0;
  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener("resize", resize);

  // 代码片段词库
  const FRAGMENTS = [
    "const", "async", "await", "return", "import", "export", "class", "function",
    "=>", "if", "else", "for", "while", "try", "catch", "throw", "new", "typeof",
    "interface", "type", "enum", "extends", "implements", "static", "readonly",
    "public", "private", "void", "null", "undefined", "true", "false", "this",
    "super", "yield", "break", "continue", "switch", "case", "default", "let",
    "var", "do", "in", "of", "instanceof", "delete", "void", "with", "debugger",
    "{}", "[]", "()", "==", "===", "!=", "!==", "&&", "||", "!", "?", ":",
    "...", "=>", "?.", "??", "${}", "/* */", "//", "`", "Cordis", "corum",
    "Agent", "preset", "inject", "provide", "Remote", "slot", "bundle", "plugin",
    "compile", "boot", "spawn", "fork", "verify", "CDP", "RPC", "MCP",
    "ctx", "config", "manifest", "deploy", "closure", "scope", "session",
    "workspace", "trait", "persona", "skill", "model", "llm", "tool", "guard",
    "perm", "sandbox", "readonly", "override", "vite", "tsc", "tsdown", "vitest",
    "pnpm", "electron", "react", "typescript", "ESM", "CJS", "lib", "src",
    "0x", "true", "init", "main", "index", "ref", "apply", "mount", "render",
    "state", "effect", "memo", "lazy", "portal", "hook", "useState", "useEffect",
    "useRef", "useMemo", "useCallback", "createContext", "useContext", "forwardRef"
  ];

  // 粒子（代码片段）
  const PARTICLE_COUNT = 220;
  let particles = [];

  function initParticles() {
    particles = [];
    for (let i = 0; i < PARTICLE_COUNT; i++) {
      const fragment = FRAGMENTS[Math.floor(Math.random() * FRAGMENTS.length)];
      const colors = ["#5B21F5", "#B98CFF", "#01CDFE", "#FF71CE", "#7B6896"];
      const color = colors[Math.floor(Math.random() * colors.length)];
      particles.push({
        fragment,
        color,
        alpha: 0.15 + Math.random() * 0.35,
        x: Math.random() * W,
        y: Math.random() * H,
        vx: (Math.random() - 0.5) * 0.3,
        vy: (Math.random() - 0.5) * 0.3,
        // 目标位置（汇聚点）
        tx: 0, ty: 0,
        hasTarget: false,
        // 汇聚后的颜色和透明度
        finalAlpha: 0,
        fontSize: 9 + Math.random() * 4
      });
    }
  }

  // 取 "Corum Harness" 文字像素点
  function getTextPixels() {
    const off = document.createElement("canvas");
    off.width = W;
    off.height = H;
    const octx = off.getContext("2d");
    const fontSize = Math.min(52, W * 0.06);
    octx.font = `700 ${fontSize}px Inter, -apple-system, sans-serif`;
    octx.textAlign = "center";
    octx.textBaseline = "middle";
    octx.fillStyle = "#FFFFFF";
    octx.fillText("Corum Harness", W / 2, H / 2);
    const data = octx.getImageData(0, 0, W, H).data;
    const pixels = [];
    // 采样：每隔 N 个像素取一个点
    const step = Math.max(4, Math.floor(W / 200));
    for (let y = 0; y < H; y += step) {
      for (let x = 0; x < W; x += step) {
        const idx = (y * W + x) * 4 + 3; // alpha
        if (data[idx] > 128) {
          pixels.push({ x, y });
        }
      }
    }
    return pixels;
  }

  function assignTargets() {
    const pixels = getTextPixels();
    if (pixels.length === 0) return;
    // 打乱粒子顺序，随机分配目标
    const shuffled = [...particles].sort(() => Math.random() - 0.5);
    for (let i = 0; i < shuffled.length; i++) {
      const p = shuffled[i];
      const target = pixels[i % pixels.length];
      p.tx = target.x + (Math.random() - 0.5) * 3;
      p.ty = target.y + (Math.random() - 0.5) * 3;
      p.hasTarget = true;
      p.finalAlpha = 0.6 + Math.random() * 0.4;
    }
  }

  // 动画状态
  let phase = "scatter"; // scatter → converge → done
  let phaseStartTime = 0;
  const phases = [
    { text: "检查环境", at: 0 },
    { text: "唤醒 Agent", at: 1800 },
    { text: "装配插件", at: 3600 },
    { text: "基本就绪", at: 5400 },
  ];
  let currentPhaseIdx = -1;
  let startTime = performance.now();

  function updatePhase(now) {
    const elapsed = now - startTime;
    let idx = -1;
    for (let i = phases.length - 1; i >= 0; i--) {
      if (elapsed >= phases[i].at) { idx = i; break; }
    }
    if (idx !== currentPhaseIdx && idx >= 0) {
      currentPhaseIdx = idx;
      $("phaseText").textContent = phases[idx].text;
    }
    // 进度条
    const progress = Math.min(100, (elapsed / 7000) * 100);
    $("progFill").style.width = progress + "%";
  }

  function animate(now) {
    if (!phaseStartTime) phaseStartTime = now;
    const elapsed = now - startTime;

    // 阶段切换
    if (phase === "scatter" && elapsed > 1500) {
      phase = "converge";
      assignTargets();
      // 显示品牌和标语
      setTimeout(() => $("brand").classList.add("show"), 800);
      setTimeout(() => $("slogan").classList.add("show"), 1600);
      setTimeout(() => $("progSection").classList.add("show"), 400);
      setTimeout(() => $("codeHint").classList.add("show"), 200);
    }

    // 更新粒子
    ctx.clearRect(0, 0, W, H);
    for (const p of particles) {
      if (phase === "converge" && p.hasTarget) {
        // 缓动飞向目标
        const dx = p.tx - p.x;
        const dy = p.ty - p.y;
        p.x += dx * 0.04;
        p.y += dy * 0.04;
        // 透明度过渡
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < 5) {
          p.alpha += (p.finalAlpha - p.alpha) * 0.1;
          // 汇聚后颜色渐变到白色
          p.color = "#FFFFFF";
        }
      } else {
        // 散布阶段：随机漂浮
        p.x += p.vx;
        p.y += p.vy;
        if (p.x < 0) p.x = W;
        if (p.x > W) p.x = 0;
        if (p.y < 0) p.y = H;
        if (p.y > H) p.y = 0;
      }

      // 绘制代码片段
      ctx.font = `${p.fontSize}px 'JetBrains Mono', 'SF Mono', monospace`;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.globalAlpha = p.alpha;
      ctx.fillStyle = p.color;
      ctx.fillText(p.fragment, p.x, p.y);
    }
    ctx.globalAlpha = 1;

    updatePhase(now);

    if (elapsed > 7000) {
      phase = "done";
      // 通知主进程启动完成
      parent.postMessage("corum:startup-complete", "*");
      // 继续渲染（保持画面）
    }

    requestAnimationFrame(animate);
  }

  // Esc 跳过
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") {
      parent.postMessage("corum:startup-complete", "*");
    }
  });
  document.addEventListener("click", () => {
    parent.postMessage("corum:startup-complete", "*");
  });

  initParticles();
  requestAnimationFrame(animate);
})();
</script>
</body>
</html>
